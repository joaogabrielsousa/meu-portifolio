<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>João Gabriel · Desenvolvedor Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <div id="stage">

        <!-- ICON 240×240 -->
        <div id="icon-wrap">
            <svg width="200" height="200" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E63950" />
                        <stop offset="100%" stop-color="#2451E0" />
                    </linearGradient>
                </defs>
                <rect width="240" height="240" rx="48" fill="#11131A" />
                <!-- subtle inner border -->
                <rect width="240" height="240" rx="48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
                <polyline id="chevron-path" points="78,58 152,120 78,182" fill="none" stroke="url(#chevronGrad)"
                    stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
                <rect id="cursor-rect" x="168" y="108" width="42" height="24" rx="7" fill="#2451E0" />
            </svg>
        </div>

        <!-- LOCKUP 640×200 -->
        <div id="lockup-wrap">
            <svg width="560" height="160" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="chevronGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E63950" />
                        <stop offset="100%" stop-color="#2451E0" />
                    </linearGradient>
                </defs>

                <!-- icon mini -->
                <rect x="20" y="20" width="160" height="160" rx="32" fill="#11131A" />
                <rect x="20" y="20" width="160" height="160" rx="32" fill="none" stroke="rgba(255,255,255,0.06)"
                    stroke-width="1.5" />
                <polyline points="58,52 112,100 58,148" fill="none" stroke="url(#chevronGrad2)" stroke-width="18"
                    stroke-linecap="round" stroke-linejoin="round" />
                <rect x="128" y="88" width="30" height="18" rx="5" fill="#2451E0" />

                <!-- wordmark -->
                <text id="wm-name" x="210" y="105" font-family="JetBrains Mono, Consolas, monospace" font-weight="700"
                    font-size="46" letter-spacing="2" fill="#F0F2F8">JOÃO GABRIEL</text>
                <text id="wm-sub" x="210" y="138" font-family="JetBrains Mono, Consolas, monospace" font-weight="500"
                    font-size="18" letter-spacing="4" fill="#5C6270">DESENVOLVEDOR WEB</text>

                <!-- accent bars -->
                <rect id="bar1" x="210" y="152" width="60" height="5" rx="2.5" fill="#E63950" />
                <rect id="bar2" x="276" y="152" width="60" height="5" rx="2.5" fill="#2451E0" />
            </svg>
        </div>

        <!-- Redirect hint -->
        <div id="hint">
            <span id="hint-text">redirecionando</span>
            <span id="hint-cursor"></span>
        </div>

        <!-- Progress bar -->
        <div id="progress-track">
            <div id="progress-fill"></div>
        </div>

    </div>
    <script src="language/script.js"></script>
</body>

</html>
